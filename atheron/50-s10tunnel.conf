# Instalado por user-step-s10.sh em /etc/ssh/sshd_config.d/. Só vale para o OpenSSH (não para o Tailscale SSH,
# que ignora isto e as opções do authorized_keys: lá a proteção é o shell do usuário, que só imprime o estado).
Match User s10tunnel
    AllowStreamLocalForwarding local
    AllowTcpForwarding local
    PermitTTY no
    X11Forwarding no
    AllowAgentForwarding no
